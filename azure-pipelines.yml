trigger:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

variables:
  dockerRegistryServiceConnection: 'eventsaasregistry'
  ACR_LOGIN_SERVER: 'eventsaasregistry.azurecr.io'
  IMAGE_NAME: 'event-saas-backend'
  IMAGE_TAG: '$(Build.BuildId)'

stages:

# ─────────────────────────────
# STAGE 1 : BUILD IMAGE
# ─────────────────────────────
- stage: Build
  displayName: Build and Push
  jobs:

  - job: Build
    displayName: Docker Build
    steps:

    - task: Docker@2
      displayName: Build and Push to ACR
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(IMAGE_NAME)'
        command: 'buildAndPush'
        Dockerfile: 'Dockerfile'
        tags: |
          $(IMAGE_TAG)
          latest


# ─────────────────────────────
# STAGE 2 : TESTS UNIT + INTEGRATION
# ─────────────────────────────
- stage: Test
  displayName: Run Tests
  dependsOn: Build
  condition: succeeded()

  jobs:

  - job: UnitTests
    displayName: Unit Tests

    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
      displayName: Install Python

    - script: |
        python -m pip install --upgrade pip
        sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov pytest-azurepipelines
      displayName: Install dependencies

    - script: |
        export DJANGO_SETTINGS_MODULE=config.settings.test

        echo "===== UNIT TESTS ====="

        pytest apps \
          -m "not integration" \
          --cov=apps \
          --cov-report=xml \
          --cov-report=term-missing \
          --cov-fail-under=75
      displayName: Run Unit Tests


  - job: IntegrationTests
    displayName: Integration Tests
    dependsOn: UnitTests

    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
      displayName: Install Python

    - script: |
        python -m pip install --upgrade pip
        sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov pytest-azurepipelines
      displayName: Install dependencies

    - script: |
        export DJANGO_SETTINGS_MODULE=config.settings.test

        echo "===== INTEGRATION TESTS ====="

        pytest apps \
          -m "integration" \
          --cov=apps \
          --cov-report=xml \
          --cov-report=term-missing
      displayName: Run Integration Tests


# ─────────────────────────────
# STAGE 3 : DEPLOY
# ─────────────────────────────
- stage: Deploy
  displayName: Deploy Backend
  dependsOn: Test
  condition: succeeded()

  jobs:

  - job: Deploy
    displayName: Deploy to Container App

    steps:

    - task: AzureCLI@2
      displayName: Update Container App
      inputs:
        azureSubscription: 'Azure subscription 1(1b6ca1a5-4833-492a-bb20-b1a8f34a9e50)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az containerapp update \
            --name event-saas-backend \
            --resource-group Eventora \
            --image $(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(Build.BuildId)