trigger:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

variables:
  dockerRegistryServiceConnection: 'eventsaasregistry' 
  ACR_LOGIN_SERVER: 'eventsaasregistry.azurecr.io'
  IMAGE_NAME: 'event-saas-backend'
  IMAGE_TAG: '$(Build.BuildId)'

stages:
# --- STAGE 1: BUILD ---
- stage: Build
  displayName: Build and Push
  jobs:
  - job: Build
    steps:
    - task: Docker@2
      displayName: Build and Push to ACR
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(IMAGE_NAME)'
        command: 'buildAndPush'
        Dockerfile: 'Dockerfile'
        tags: |
          $(IMAGE_TAG)
          latest

# --- STAGE 2: TEST ---
- stage: Test
  displayName: Run Unit Tests
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: RunTests
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
      displayName: 'Install Python 3.11'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Installation des outils de test s'ils ne sont pas dans requirements.txt
        pip install pytest pytest-django pytest-azurepipelines
      displayName: 'Install dependencies'

    - script: |
        # Django utilise par défaut une base SQLite en mémoire pour les tests, 
        # ce qui évite d'avoir besoin de MySQL dans le pipeline.
        python manage.py test
      displayName: 'Run Django Tests'

# --- STAGE 3: DEPLOY ---
- stage: Deploy
  displayName: Deploy to Container App
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: Deploy
    steps:
    - task: AzureCLI@2
      displayName: Update Container App
      inputs:
        azureSubscription: 'Azure subscription 1(1b6ca1a5-4833-492a-bb20-b1a8f34a9e50)' 
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az containerapp update \
            --name event-saas-backend \
            --resource-group Eventora \
            --image $(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(Build.BuildId)