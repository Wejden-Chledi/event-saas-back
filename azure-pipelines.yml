# azure-Pipelines.yml
trigger:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

variables:
  dockerRegistryServiceConnection: 'eventsaasregistry' 
  ACR_LOGIN_SERVER: 'eventsaasregistry.azurecr.io'
  IMAGE_NAME: 'event-saas-backend'
  IMAGE_TAG: '$(Build.BuildId)'

stages:
- stage: Test
  displayName: "Validation & Tests"
  jobs:
  - job: RunTests
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov
      displayName: 'Installer les dépendances'

    - script: |
        export DJANGO_SETTINGS_MODULE=config.settings.test
        # Lancement de pytest
        pytest --cov=apps --cov-report=xml --junitxml=test-results.xml
      displayName: 'Exécuter les tests'
      env:
        # --- CRITIQUE : C'est ici qu'on lie les variables de l'interface ---
        SECRET_KEY: $(SECRET_KEY)
        CORS_ALLOWED_ORIGINS: $(CORS_ALLOWED_ORIGINS)
        AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
        AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
        AZURE_OPENAI_DEPLOYMENT: $(AZURE_OPENAI_DEPLOYMENT)
        STRIPE_PUBLIC_KEY: $(STRIPE_PUBLIC_KEY)
        STRIPE_SECRET_KEY: $(STRIPE_SECRET_KEY)
        AZURE_ACCOUNT_NAME: $(AZURE_ACCOUNT_NAME)
        AZURE_ACCOUNT_KEY: $(AZURE_ACCOUNT_KEY)
        AZURE_CONTAINER: $(AZURE_CONTAINER)
        DB_PORT: 3306

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'test-results.xml'
        title: 'Rapport des tests'

- stage: Build
  displayName: "Build and Push"
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: Build
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(IMAGE_NAME)'
        command: 'buildAndPush'
        Dockerfile: 'Dockerfile'
        tags: |
          $(IMAGE_TAG)
          latest

- stage: Deploy
  displayName: "Deploy to Container App"
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'Azure subscription 1(1b6ca1a5-4833-492a-bb20-b1a8f34a9e50)' 
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az containerapp update \
            --name event-saas-backend \
            --resource-group Eventora \
            --image $(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(Build.BuildId)