trigger:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

variables:
  # Importation du groupe de variables créé dans la Library
  - group: eventora-secrets
  # Variables statiques du pipeline
  - name: dockerRegistryServiceConnection
    value: 'eventsaasregistry' 
  - name: ACR_LOGIN_SERVER
    value: 'eventsaasregistry.azurecr.io'
  - name: IMAGE_NAME
    value: 'event-saas-backend'
  - name: IMAGE_TAG
    value: '$(Build.BuildId)'

stages:
# --- STAGE 1 : TESTS UNITAIRES ---
- stage: Test
  displayName: "Validation & Tests"
  jobs:
  - job: RunTests
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov
      displayName: 'Install Dependencies'

    - script: |
        export DJANGO_SETTINGS_MODULE=config.settings.test
        # Lancement de pytest avec génération de rapports
        pytest --cov=apps --cov-report=xml --junitxml=test-results.xml
      displayName: 'Run Pytest'
      env:
        # On injecte ici les variables depuis le Variable Group
        SECRET_KEY: $(SECRET_KEY)
        AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
        AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
        STRIPE_SECRET_KEY: $(STRIPE_SECRET_KEY)
        DB_PORT: 3306 # Valeur par défaut pour éviter les erreurs d'init

    # Publication des résultats même si un test échoue
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'test-results.xml'
        title: 'Rapport des tests unitaires'

    - task: PublishCodeCoverageResults@1
      condition: always()
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'
      displayName: 'Rapport de couverture'

# --- STAGE 2 : BUILD DOCKER ---
- stage: Build
  displayName: "Build and Push"
  dependsOn: Test
  condition: succeeded() # Ne build que si les tests passent
  jobs:
  - job: Build
    steps:
    - task: Docker@2
      displayName: "Build and Push image to ACR"
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(IMAGE_NAME)'
        command: 'buildAndPush'
        Dockerfile: 'Dockerfile'
        tags: |
          $(IMAGE_TAG)
          latest

# --- STAGE 3 : DÉPLOIEMENT ---
- stage: Deploy
  displayName: "Deploy to Azure"
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    steps:
    - task: AzureCLI@2
      displayName: "Update Container App with latest image"
      inputs:
        azureSubscription: 'Azure subscription 1(1b6ca1a5-4833-492a-bb20-b1a8f34a9e50)' 
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az containerapp update \
            --name event-saas-backend \
            --resource-group Eventora \
            --image $(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(Build.BuildId)